name: Feature request
description: Suggest an improvement or new capability for the subnet
title: "[feature] "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Use this template to propose new features, scoring tweaks, or
        operator-experience improvements. For Yuma-relevant changes,
        please describe how the feature preserves validator consensus.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected (miners, validators, operators, marketplace users)?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: yuma
    attributes:
      label: Yuma / consensus impact
      description: |
        If the change touches scoring, weights, or probe behaviour:
        does it remain deterministic across validators? Does it require a
        spec_version bump?

  - type: textarea
    id: extra
    attributes:
      label: Additional context
